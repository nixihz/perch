# 使用平台已有的通配证书；应用文件仍由 app-platform 管理。
server {
    listen 80;
    listen [::]:80;
    server_name perch.u1.fan;
    location / { return 301 https://$host$request_uri; }
}
server {
    listen 443 ssl;
    listen [::]:443 ssl;
    server_name perch.u1.fan;
    ssl_certificate /etc/letsencrypt/live/wildcard.u1.fan/fullchain.pem;
    ssl_certificate_key /etc/letsencrypt/live/wildcard.u1.fan/privkey.pem;
    ssl_protocols TLSv1.2 TLSv1.3;
    ssl_session_cache shared:perch_tls:10m;
    ssl_session_timeout 1d;
    ssl_session_tickets off;
    client_max_body_size 25m;
    add_header Strict-Transport-Security 'max-age=31536000' always;
    access_log /var/log/nginx/perch.u1.fan.access.log main;
    error_log /var/log/nginx/perch.u1.fan.error.log;
    location / {
        proxy_pass http://127.0.0.1:4183;
        proxy_http_version 1.1;
        proxy_set_header Host $http_host;
        proxy_set_header X-Real-IP $remote_addr;
        proxy_set_header X-Forwarded-For $remote_addr;
        proxy_set_header X-Forwarded-Proto $scheme;
        proxy_set_header Upgrade $http_upgrade;
        proxy_set_header Connection $app_u1_fan_connection;
        proxy_buffering off;
        proxy_read_timeout 3600s;
        proxy_send_timeout 3600s;
    }
    # 清单路径固定，必须及时重新验证；唯一命名的 DMG 仍可长期缓存。
    location = /updates/macos/appcast.xml {
        proxy_pass http://127.0.0.1:4183;
        proxy_http_version 1.1;
        proxy_set_header Host $http_host;
        proxy_set_header X-Real-IP $remote_addr;
        proxy_set_header X-Forwarded-For $remote_addr;
        proxy_set_header X-Forwarded-Proto $scheme;
        proxy_hide_header Cache-Control;
        add_header Cache-Control 'no-cache' always;
        add_header Strict-Transport-Security 'max-age=31536000' always;
    }
}
