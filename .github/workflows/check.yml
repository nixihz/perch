name: Skill checks

on:
  push:
  pull_request:

permissions:
  contents: read

jobs:
  check:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: '22'
      - uses: actions/setup-python@v5
        with:
          python-version: '3.12'
      - name: Install offline integration test dependency
        run: python -m pip install PyYAML==6.0.3
      - name: Check skill structure
        run: node scripts/check-skills.mjs
      - name: Test structure checker
        run: node --test tests/check-skills.test.mjs
      - name: Verify catalog snapshots
        run: python scripts/catalog.py verify
      - name: Test catalog and UI localization
        run: python -m unittest tests.test_catalog tests.test_ui_localization tests.test_update_packaging tests.test_sparkle_appcast tests.test_macos_release -v

  macos:
    name: Native macOS app
    runs-on: macos-15
    steps:
      - uses: actions/checkout@v4
      - name: Select Swift 6 toolchain
        run: |
          sudo xcode-select --switch /Applications/Xcode_16.4.app
          swift --version
      - name: Build SkillSet.app target
        run: swift build --product SkillSetDesktop
      - name: Run Swift core tests
        run: swift test --filter SkillSetCoreTests
      - name: Build CLI and MCP server
        run: swift build --product skillset
      - name: Package app with Sparkle and verify embedded MCP
        run: ./script/build_and_run.sh --no-open
      - name: Run CLI and MCP integration tests
        run: python -m unittest tests.test_cli_integration -v
