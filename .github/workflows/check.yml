name: Skill checks

on:
  push:
  pull_request:

permissions:
  contents: read

jobs:
  check:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: '22'
      - uses: actions/setup-python@v5
        with:
          python-version: '3.12'
      - uses: azure/setup-kubectl@v4
        with:
          version: 'v1.34.1'
      - name: Install offline integration test dependency
        run: python -m pip install PyYAML==6.0.3
      - name: Check skill structure
        run: node scripts/check-skills.mjs
      - name: Test structure checker
        run: node --test tests/check-skills.test.mjs
      - name: Test STC checker
        run: python skills/stc/scripts/stc-lint.py --selftest
      - name: Test kubeconfig manager
        run: |
          command -v kubectl
          python -m unittest discover -s skills/kubeconfig-manager/tests -v